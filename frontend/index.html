<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Slot</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Slot Booking System</h1>
            <nav>
                <a href="index.html" class="active">Book Slot</a>
                <a href="booked-slots.html">View Booked Slots</a>
            </nav>
        </header>

        <main>
            <div class="booking-form-container">
                <h2>Book Your Time Slot</h2>
                
                <form id="bookingForm">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="username">Username *</label>
                        <input type="text" id="username" name="username" required placeholder="Enter username">
                    </div>

                    <div class="form-group">
                        <label for="date">Select Date *</label>
                        <input type="date" id="date" name="date" required min="2026-03-06">
                    </div>

                    <div class="form-group">
                        <label for="time_slot">Select Time Slot *</label>
                        <select id="time_slot" name="time_slot" required>
                            <option value="">Choose a time slot</option>
                            <option value="09:00:00">09:00 AM - 10:00 AM</option>
                            <option value="10:00:00">10:00 AM - 11:00 AM</option>
                            <option value="11:00:00">11:00 AM - 12:00 PM</option>
                            <option value="12:00:00">12:00 PM - 01:00 PM</option>
                            <option value="14:00:00">02:00 PM - 03:00 PM</option>
                            <option value="15:00:00">03:00 PM - 04:00 PM</option>
                            <option value="16:00:00">04:00 PM - 05:00 PM</option>
                            <option value="17:00:00">05:00 PM - 06:00 PM</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Book Slot</button>
                </form>

                <div id="message" class="message"></div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
